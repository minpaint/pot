{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div style="max-width: 420px;">
  <p>Будут созданы акты для всех контрагентов за выбранный месяц по курсу НБРБ на последний день месяца.</p>

  <form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:12px; align-items:flex-end; margin-top:16px;">
      <div>
        <label style="display:block; font-weight:bold; margin-bottom:4px;">Месяц</label>
        <select name="month" style="padding:6px 10px; font-size:14px;">
          {% for num, name in months %}
          <option value="{{ num }}" {% if num == current_month %}selected{% endif %}>{{ name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label style="display:block; font-weight:bold; margin-bottom:4px;">Год</label>
        <select name="year" style="padding:6px 10px; font-size:14px;">
          {% for y in years %}
          <option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <input type="submit" value="Сформировать акты"
               style="padding:6px 16px; font-size:14px; background:#417690; color:#fff; border:none; border-radius:4px; cursor:pointer;">
      </div>
    </div>
  </form>
</div>
{% endblock %}
