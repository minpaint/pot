{% extends "admin/change_list.html" %}
{% load static %}

{% block object-tools-items %}
  {{ block.super }}
  <li>
    <a href="{% url 'admin:directory_question_export' %}" class="addlink" style="background-position: 0 -96px;">
      📤 Экспорт в Excel
    </a>
  </li>
{% endblock %}

{% block extrahead %}
  {{ block.super }}
  <style>
    /* Стили для кнопки экспорта */
    .object-tools li a.addlink {
      padding-left: 16px;
    }
    @media (max-width: 768px) {
      .column-question_number_display, .field-question_number_display,
      .column-category, .field-category,
      .column-image_preview, .field-image_preview,
      .column-answers_count, .field-answers_count,
      .column-created, .field-created { display: none !important; }
    }
  </style>
{% endblock %}
