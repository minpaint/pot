<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Экзамен - OT Online{% endblock %}</title>

    <!-- Блокировка индексации поисковыми системами -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="bingbot" content="noindex, nofollow">
    <meta name="yandex" content="noindex, nofollow">

    <!-- Bootstrap CSS через CDN 📡 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous">
    {% load static %}
    <!-- Основной стиль приложения 🎨 -->
    <link href="{% static 'directory/css/style.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}

    <!-- Twemoji: корректное отображение эмодзи в старых браузерах -->
    <style>
        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
            display: inline-block;
        }
    </style>

    <style>
        :root {
            --ot-font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
        }

        body {
            font-family: var(--ot-font-sans);
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }
    </style>
</head>
<body>
    <!-- Основной контент без навигации и футера 📄 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle через CDN ⚡ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>

    <!-- Font Awesome для иконок ✨ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block extra_js %}{% endblock %}

    <!-- Twemoji: кроссбраузерное отображение эмодзи -->
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
        twemoji.parse(document.body, {
            folder: 'svg',
            ext: '.svg',
            base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@v14.0.2/assets/'
        });
    </script>
</body>
</html>
